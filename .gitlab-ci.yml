variables:
  REGION: asia-southeast1
  IMAGE_NAME: ktn-wallet-iapi
  APP_NAME_API: ktn-wallet-iapi
  APP_NAME_DAPP: ktn-wallet-dapp
  APP_NAME_WALLET_TX_QUEUE: ktn-wallet-tx-queue
  APP_NAME_WALLET_RECEIPT_TX_QUEUE: ktn-wallet-receipt-tx-queue
  APP_NAME_WALLET_PENDING_TX_QUEUE: ktn-wallet-pending-tx-queue
  APP_NAME_WALLET_POINT_QUEUE: ktn-wallet-point-queue
  CONTAINER_REPO_ASIA_STAG: 968557029040.dkr.ecr.ap-southeast-1.amazonaws.com/stag/ktn-wallet-iapi
  CONTAINER_REPO_ASIA_PROD: 968557029040.dkr.ecr.ap-southeast-1.amazonaws.com/prod/ktn-wallet-iapi
  NAMESPACE_STAG: ktn-iapi-stag  
  NAMESPACE_PROD: ktn-iapi-prod  
  HELM_VALUE_FOLDER: katana
  FULLREPO_ASIA_DEV: $CONTAINER_REPO_ASIA_DEV:$CI_COMMIT_SHA
  FULLREPO_ASIA_TEST: $CONTAINER_REPO_ASIA_TEST:$CI_COMMIT_SHA
  FULLREPO_ASIA_STAG: $CONTAINER_REPO_ASIA_STAG:$CI_COMMIT_SHA
  FULLREPO_ASIA_PROD: $CONTAINER_REPO_ASIA_PROD:$CI_COMMIT_SHA
  HELM_VALUE: ${CI_COMMIT_REF_NAME}
  HELM_VERSION: 3.0.1
  HELM_CRONJOB_VERSION: 0.1.9
  AWS_REGION: ap-southeast-1
  GITLAB_TOKEN: $GITLAB_RUNNER_TOKEN
  DOCKER_DRIVER: overlay
 # DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build
  - deploy

.kubectl_config: &kubectl_config
  - |
      if [ "$CI_COMMIT_REF_NAME" == "master" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-production-cluster
      fi
  - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-staging-cluster
      fi
  - |
      if [ "$CI_COMMIT_REF_NAME" == "dev" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-staging-cluster
      fi
.predeploy: &predeploy |
  apk add --no-cache  bash git  python3 py3-pip curl
  pip3 install --upgrade pip 
  pip3 install --no-cache-dir awscli==1.25.78
  helm plugin install https://github.com/hypnoglow/helm-s3.git --version 0.12.0
  helm repo add helm-template s3://esol-helm-template
  helm repo add helm-template-cronjob s3://esol-helm-template/cronjob
  helm pull s3://esol-helm-template/helm-template-$HELM_VERSION.tgz --untar=true
  helm pull s3://esol-helm-template/cronjob/helm-template-cronjob-$HELM_CRONJOB_VERSION.tgz --untar=true

build_stag:
  image: docker:19.03.1
  tags:
  - esol-stag-test
  stage: build
  services:
  - docker:19.03.1-dind
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
    - ./node_modules/
  before_script:
    - apk add --no-cache curl jq python py-pip wget git bash
    - pip install awscli 
    - git submodule add -f --branch stag https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/katana/ktn-lib.git lib
    - export VERIFY_CHECKSUM=false && curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 && chmod +x ./get_helm.sh && ./get_helm.sh
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v1.38.0/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin
    - git submodule sync --recursive
    - git submodule update --init --remote --recursive
  script:
  #  - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $CONTAINER_REPO_ASIA_STAG
    - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $CONTAINER_REPO_ASIA_STAG
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE_STAG#g" skaffold.yaml
        sed -i -e "s#\[CONTAINER_REPO\]#$CONTAINER_REPO_ASIA_STAG#g" skaffold.yaml
        sed -i -e "s#\[APP_NAME\]#$IMAGE_NAME#g" skaffold.yaml
        sed -i -e "s#\[CI_COMMIT_REF_NAME\]#$CI_COMMIT_REF_NAME#g" skaffold.yaml
        cat skaffold.yaml
      fi
  #  - cp -f $PRIVATE_WALLET_STAG ./privates.json
    - /usr/local/bin/skaffold build -p profile-stag --file-output=build_sync.json
  only:
    refs:
      - stag
  artifacts:
    paths:
    - build_sync.json

deploy_APP_NAME_DAPP_stag:
  stage: deploy
  image:  alpine/helm:3.2.1
  tags:
  - test
  script:
    - *predeploy
    - *kubectl_config
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE_STAG#g" skaffold.yaml
        sed -i -e "s#\[APP_NAME\]#$APP_NAME_DAPP#g" skaffold.yaml
        sed -i -e "s#\[CONTAINER_REPO\]#$CONTAINER_REPO_ASIA_STAG#g" skaffold.yaml
        sed -i -e "s#\[CI_COMMIT_REF_NAME\]#$CI_COMMIT_REF_NAME#g" skaffold.yaml
      fi
    - git clone https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/rinz-io-devops/helm-value/$HELM_VALUE_FOLDER/$IMAGE_NAME.git
    - mv $IMAGE_NAME/${APP_NAME_DAPP}-stag.yaml .
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.24.0/bin/linux/amd64/kubectl && chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v1.38.0/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin
    - /usr/local/bin/skaffold deploy -p profile-${APP_NAME_DAPP}-stag   -a build_sync.json

  only:
    refs:
      - stag


